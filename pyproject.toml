[project]
name = "beni-control"
version = "0.1.0"
description = "PC-side controller for the Mondo Robotics Beni robot (MuJoCo simulation backend for now)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.26",
  "onnxruntime>=1.19",
]

[project.scripts]
beni-sim = "beni_control.sim_main:main"
beni-teleop = "beni_control.teleop:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beni_control"]
